version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lunar_postgres
    restart: always
    environment:
      POSTGRES_USER: {DB_USER}
      POSTGRES_PASSWORD: {DB_PASSWORD}
      POSTGRES_DB: {DB_NAME}
    ports:
      - "{DB_PORT}:{DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {DB_USER} -d {DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: lunar_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_USER={DB_USER}
      - DB_PASSWORD={DB_PASSWORD}
      - DB_HOST=db
      - DB_NAME={DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: lunar_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: